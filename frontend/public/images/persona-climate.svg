<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p-climate-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#p-climate-bg)" />
  <!-- Forest & Vegetation Canopy Vectors -->
  <g fill="#047857" opacity="0.6">
    <path d="M 30 210 L 70 120 L 110 210 Z" />
    <path d="M 90 210 L 135 100 L 180 210 Z" />
    <path d="M 160 210 L 205 130 L 250 210 Z" />
    <path d="M 230 210 L 275 90 L 320 210 Z" />
    <path d="M 300 210 L 340 125 L 380 210 Z" />
  </g>
  <!-- Foreground Forest -->
  <g fill="#10B981" opacity="0.8">
    <path d="M 60 210 L 100 135 L 140 210 Z" />
    <path d="M 130 210 L 170 115 L 210 210 Z" />
    <path d="M 200 210 L 245 105 L 290 210 Z" />
    <path d="M 270 210 L 310 140 L 350 210 Z" />
  </g>
  <!-- Atmospheric Heatwave & Rainfall Vector Curve -->
  <path d="M 30 80 Q 120 40 210 70 T 370 50" stroke="#34D399" stroke-width="2.5" fill="none" />
  <path d="M 30 110 Q 120 70 210 100 T 370 80" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
  <!-- Ground Line -->
  <line x1="20" y1="210" x2="380" y2="210" stroke="#6EE7B7" stroke-width="2" />
  <!-- Badge -->
  <rect x="20" y="20" width="180" height="24" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#10B981" stroke-width="1" />
  <text x="32" y="36" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">CANOPY STRESS / NDVI Z-SCORE</text>
</svg>
