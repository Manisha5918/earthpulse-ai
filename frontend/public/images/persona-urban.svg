    <rect x="75" y="70" width="40" height="140" rx="2" />
    <rect x="120" y="120" width="35" height="90" rx="2" />
    <rect x="160" y="50" width="50" height="160" rx="2" />
    <rect x="215" y="90" width="30" height="120" rx="2" />
