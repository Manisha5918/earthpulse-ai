<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p-esg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#p-esg-bg)" />
  <!-- ESG Score Radar / Polygon Gauge -->
  <g transform="translate(200, 130)">
    <!-- Concentric Web Rings -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.6" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.8" />
    <!-- 5 Radar Axis Lines -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#78350F" stroke-width="1" />
    <line x1="-57" y1="-18" x2="57" y2="18" stroke="#78350F" stroke-width="1" />
    <line x1="-35" y1="48" x2="35" y2="-48" stroke="#78350F" stroke-width="1" />
    <!-- Radar Filled Polygon (Score 41.5) -->
    <polygon points="0,-48 45,-12 28,38 -30,35 -40,-15" fill="#F59E0B" fill-opacity="0.35" stroke="#FBBF24" stroke-width="2" />
    <!-- Score Center Circle -->
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="4" fill="#FEF3C7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">41.5</text>
  </g>
  <!-- Badge -->
  <rect x="20" y="20" width="180" height="24" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1" />
  <text x="32" y="36" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">0–100 REGIONAL SCORE</text>
</svg>
