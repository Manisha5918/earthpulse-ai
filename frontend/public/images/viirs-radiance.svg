<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-viirs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="nightlight-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="1" />
      <stop offset="20%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nightlight-sub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bg-grad-viirs)" />

  <!-- Road Network Mesh (Dark Nocturnal Grids) -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.4">
    <line x1="80" y1="80" x2="520" y2="300" />
    <line x1="520" y1="80" x2="80" y2="300" />
    <line x1="300" y1="50" x2="300" y2="320" />
    <line x1="100" y1="180" x2="500" y2="180" />
    <circle cx="300" cy="180" r="80" fill="none" stroke-dasharray="2 4" />
    <circle cx="300" cy="180" r="140" fill="none" stroke-dasharray="3 6" />
  </g>

  <!-- Major Urban Glowing Cores (Radiance Heatmap) -->
  <!-- Central Urban Core -->
  <circle cx="300" cy="180" r="110" fill="url(#nightlight-core)" />
  <circle cx="300" cy="180" r="50" fill="#FEF3C7" fill-opacity="0.7" />
  <circle cx="300" cy="180" r="15" fill="#FFFFFF" />

  <!-- Secondary Industrial Clusters (OMR / Guindy / Sriperumbudur) -->
  <circle cx="210" cy="220" r="60" fill="url(#nightlight-sub)" />
  <circle cx="210" cy="220" r="8" fill="#FEF08A" />

  <circle cx="390" cy="150" r="50" fill="url(#nightlight-sub)" />
  <circle cx="390" cy="150" r="6" fill="#FEF08A" />

  <circle cx="350" cy="250" r="45" fill="url(#nightlight-sub)" />

  <!-- Sensor Optical Tracking Line -->
  <path d="M 50 120 C 180 80, 400 260, 550 210" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.8" />

  <!-- VIIRS Suomi-NPP Satellite in Orbit -->
  <g transform="translate(480, 60)">
    <rect x="-30" y="-8" width="60" height="16" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#D97706" />
    <!-- DNB Sensor Cone -->
    <polygon points="-5,12 5,12 15,35 -15,35" fill="#F59E0B" fill-opacity="0.3" />
  </g>

  <!-- Telemetry HUD Badges -->
  <g transform="translate(24, 28)">
    <rect width="190" height="24" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#D97706" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#F59E0B" />
    <text x="24" y="16" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">NOAA VIIRS DNB (750m)</text>
  </g>

  <g transform="translate(24, 305)">
    <rect width="250" height="30" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="12" y="19" fill="#94A3B8" font-family="monospace" font-size="10">RADIANCE: <tspan fill="#FBBF24" font-weight="bold">23.76 nW/(cm²·sr)</tspan> (+33.4%)</text>
  </g>

  <g transform="translate(380, 305)">
    <rect width="196" height="30" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="12" y="19" fill="#94A3B8" font-family="monospace" font-size="10">URBAN SHIFT: <tspan fill="#34D399" font-weight="bold">HIGH CLUSTERING</tspan></text>
  </g>
</svg>
